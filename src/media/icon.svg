<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 300" width="280" height="300">
  <defs>
    <!-- Blue glow concentrated on lower-left of Q, fading to dark navy right -->
    <linearGradient id="q2grad" x1="10%" y1="90%" x2="80%" y2="10%">
      <stop offset="0%"  stop-color="#1e5ce8"/>
      <stop offset="22%" stop-color="#0d1f7a"/>
      <stop offset="50%" stop-color="#060c20"/>
      <stop offset="100%" stop-color="#060c20"/>
    </linearGradient>

    <!-- Glow filter: blurs a blue-tinted copy behind the text -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.06
                0 0 0 0 0.18
                0 0 0 0 0.92
                0 0 0 0.75 0" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Q2 logotype -->
  <text
    x="142" y="220"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="198" font-weight="bold"
    fill="url(#q2grad)"
    filter="url(#glow)">Q2</text>

  <!-- COMPUTING wordmark -->
  <text
    x="140" y="278"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="28" font-weight="700"
    letter-spacing="6"
    fill="#111111">COMPUTING</text>
</svg>
